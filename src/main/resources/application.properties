spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/backend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# dev-only default, must be overridden via APP_JWT_SECRET in every real environment
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

